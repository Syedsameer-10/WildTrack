services:
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      APP_CORS_ORIGINS: http://localhost:5173
      PORT: 8000
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy
